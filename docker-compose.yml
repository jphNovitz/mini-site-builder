services:
  migrate:
    build: .
    command: php artisan migrate --force
    env_file: .env
    environment: *app-env
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  app:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:8080"
    env_file: .env
    environment: *app-env
    volumes:
      - cartes:/app/public/cartes
      - logos:/app/storage/app/public
    depends_on:
      migrate:
        condition: service_completed_successfully

  scheduler:
    build: .
    restart: unless-stopped
    command: sh -c "while true; do php artisan schedule:run; sleep 60; done"
    env_file: .env
    environment: *app-env
    volumes:
      - cartes:/app/public/cartes
      - logos:/app/storage/app/public
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  mariadb-data:
  cartes:
  logos:
