x-app-env: &app-env
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: 3306

services:
  mysql:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_DATABASE}
      MARIADB_USER: ${DB_USERNAME}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_ROOT_PASSWORD}", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 30

  migrate:
    build: .
    command: php artisan migrate --force
    env_file: .env
    environment: *app-env
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  app:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:8080"
    env_file: .env
    environment: *app-env
    volumes:
      - cartes:/app/public/cartes
      - logos:/app/storage/app/public
    depends_on:
      migrate:
        condition: service_completed_successfully

  scheduler:
    build: .
    restart: unless-stopped
    command: sh -c "while true; do php artisan schedule:run; sleep 60; done"
    env_file: .env
    environment: *app-env
    volumes:
      - cartes:/app/public/cartes
      - logos:/app/storage/app/public
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  mariadb-data:
  cartes:
  logos:
